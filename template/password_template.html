<!DOCTYPE html>
<html class="staticrypt-html" lang="he" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <title>מצגת: מיטשל, ביטחון ותשוקה</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="referrer" content="no-referrer" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --sc-bg: #0b0a09;
                --sc-card: #15130f;
                --sc-field: #1e1b16;
                --sc-text: #f3ece1;
                --sc-muted: rgba(243, 236, 225, 0.68);
                --sc-accent: #ffb35c;
                --sc-line: rgba(255, 179, 92, 0.22);
                --sc-error: #ff8a7a;
            }

            .staticrypt-html {
                height: 100%;
                background: var(--sc-bg);
            }

            .staticrypt-body {
                min-height: 100%;
                height: 100%;
                margin: 0;
                background: var(--sc-bg);
                color: var(--sc-text);
                font-family: "Heebo", "Segoe UI", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                width: 100%;
                max-width: 400px;
                box-sizing: border-box;
                padding: 40px 36px 32px;
                background: var(--sc-card);
                border: 1px solid var(--sc-line);
                border-radius: 18px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
                text-align: center;
            }

            .staticrypt-title {
                margin: 0 0 12px;
                font-size: 1.55em;
                font-weight: 700;
                line-height: 1.35;
                color: var(--sc-text);
            }

            .staticrypt-title::after {
                content: "";
                display: block;
                width: 48px;
                height: 3px;
                margin: 14px auto 0;
                border-radius: 2px;
                background: var(--sc-accent);
            }

            .staticrypt-instructions-text {
                margin: 0 0 26px;
                color: var(--sc-muted);
                line-height: 1.6;
            }

            .staticrypt-password-container {
                position: relative;
                margin: 0 0 14px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                padding: 14px 16px;
                padding-inline-end: 48px;
                font: inherit;
                font-size: 16px;
                color: var(--sc-text);
                background: var(--sc-field);
                border: 1px solid rgba(243, 236, 225, 0.14);
                border-radius: 10px;
                outline: 0;
                text-align: right;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .staticrypt-form input::placeholder {
                color: rgba(243, 236, 225, 0.4);
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--sc-accent);
                box-shadow: 0 0 0 3px rgba(255, 179, 92, 0.2);
            }

            .staticrypt-toggle-password-visibility {
                position: absolute;
                top: 50%;
                inset-inline-end: 6px;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                padding: 10px;
                cursor: pointer;
                opacity: 0.55;
                filter: invert(1);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.85;
            }

            .staticrypt-error {
                margin: 0 0 14px;
                color: var(--sc-error);
                font-size: 0.95em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 0 0 20px;
                color: var(--sc-muted);
                font-size: 0.95em;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 18px;
                height: 18px;
                margin: 0;
                accent-color: var(--sc-accent);
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                padding: 14px;
                font: inherit;
                font-size: 17px;
                font-weight: 700;
                color: var(--sc-bg);
                background: var(--sc-accent);
                border: 0;
                border-radius: 10px;
                cursor: pointer;
                transition: filter 0.15s ease, transform 0.05s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                filter: brightness(1.07);
            }

            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                outline: 2px solid var(--sc-text);
                outline-offset: 3px;
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--sc-accent);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner {
                    animation-duration: 2s;
                }
            }

            @media (max-width: 420px) {
                .staticrypt-form {
                    padding: 32px 22px 26px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">

                    <div class="staticrypt-password-container">

                            type="password"
                            name="password"

                            aria-label="סיסמה"

                            autofocus

                        />

                    <p id="staticrypt-error" class="staticrypt-error hidden" role="alert"></p>

                    <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" />
                        <span>לזכור אותי במכשיר הזה</span>
                    </label>

                    <input type="submit" class="staticrypt-decrypt-button" value="כניסה" />
                </form>
            </main>
        </div>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "הסיסמה שגויה, נסו שוב",
                templateToggleAltShow = "הצגת הסיסמה",
                templateToggleAltHide = "הסתרת הסיסמה",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission: show the error inline instead of alert()
            const errorBox = document.getElementById("staticrypt-error");
            document.getElementById("staticrypt-password").addEventListener("input", function () {
                errorBox.classList.add("hidden");
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const passwordInput = document.getElementById("staticrypt-password"),
                    password = passwordInput.value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    errorBox.textContent = templateError;
                    errorBox.classList.remove("hidden");
                    passwordInput.select();
                    passwordInput.focus();
                }
            });

    </body>
</html>
